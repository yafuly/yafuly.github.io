<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">π-Bench overall performance</title>
  <desc id="desc">Scatter plot comparing average task completion and proactive intent recovery, with Claude Opus 4.6 details.</desc>
  <defs>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="pointShadow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #fbfdff; stroke: #dbe3ef; stroke-width: 1.5; }
      .plot { fill: #fcfdff; stroke: #b8c4d3; stroke-width: 1.4; }
      .grid { stroke: #dbe3ef; stroke-width: 1; }
      .axis { stroke: #aebccd; stroke-width: 1.8; }
      .diag { stroke: #94a3b8; stroke-width: 2.8; stroke-dasharray: 12 12; stroke-linecap: round; }
      .tick, .label, .point-label, .card-label, .domain { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tick { fill: #5f6b7d; font-size: 22px; font-weight: 800; }
      .label { fill: #151a24; font-size: 24px; font-weight: 900; }
      .point-label { fill: #515c70; font-size: 19px; font-weight: 900; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .point-label.active { fill: #151a24; font-size: 21px; }
      .point { stroke: #ffffff; stroke-width: 4; filter: url(#pointShadow); }
      .point.active { stroke: #151a24; stroke-width: 5; }
      .card-title { fill: #151a24; font-size: 27px; font-weight: 900; }
      .card-label { fill: #64748b; font-size: 20px; font-weight: 850; }
      .card-value { fill: #111827; font-family: Georgia, "Times New Roman", serif; font-size: 42px; font-weight: 900; }
      .card-small { fill: #64748b; font-size: 18px; font-weight: 850; }
      .domain { fill: #64748b; font-size: 20px; font-weight: 850; }
      .score { fill: #111827; font-size: 21px; font-weight: 900; }
      .rule { stroke: #dbe3ef; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="720"/>

  <rect class="panel" x="18" y="12" width="1168" height="696" rx="9"/>
  <rect class="panel" x="1210" y="12" width="374" height="696" rx="9"/>

  <g id="scatter">
    <rect class="plot" x="110" y="60" width="980" height="560"/>

    <g id="x-grid">
      <line class="grid" x1="110" y1="60" x2="110" y2="620"/>
      <line class="grid" x1="355" y1="60" x2="355" y2="620"/>
      <line class="grid" x1="600" y1="60" x2="600" y2="620"/>
      <line class="grid" x1="845" y1="60" x2="845" y2="620"/>
      <line class="grid" x1="1090" y1="60" x2="1090" y2="620"/>
    </g>
    <g id="y-grid">
      <line class="grid" x1="110" y1="620" x2="1090" y2="620"/>
      <line class="grid" x1="110" y1="526.7" x2="1090" y2="526.7"/>
      <line class="grid" x1="110" y1="433.3" x2="1090" y2="433.3"/>
      <line class="grid" x1="110" y1="340" x2="1090" y2="340"/>
      <line class="grid" x1="110" y1="246.7" x2="1090" y2="246.7"/>
      <line class="grid" x1="110" y1="153.3" x2="1090" y2="153.3"/>
      <line class="grid" x1="110" y1="60" x2="1090" y2="60"/>
    </g>

    <line class="axis" x1="110" y1="620" x2="1090" y2="620"/>
    <line class="axis" x1="110" y1="60" x2="110" y2="620"/>
    <line class="diag" x1="110" y1="433.3" x2="1090" y2="60"/>

    <g class="tick">
      <text x="110" y="654" text-anchor="middle">50</text>
      <text x="355" y="654" text-anchor="middle">55</text>
      <text x="600" y="654" text-anchor="middle">60</text>
      <text x="845" y="654" text-anchor="middle">65</text>
      <text x="1090" y="654" text-anchor="middle">70</text>
      <text x="88" y="626" text-anchor="end">40</text>
      <text x="88" y="533" text-anchor="end">45</text>
      <text x="88" y="439" text-anchor="end">50</text>
      <text x="88" y="346" text-anchor="end">55</text>
      <text x="88" y="253" text-anchor="end">60</text>
      <text x="88" y="159" text-anchor="end">65</text>
      <text x="88" y="66" text-anchor="end">70</text>
    </g>

    <text class="label" x="600" y="694" text-anchor="middle">Average task completion, Comp (%)</text>
    <text class="label" x="-340" y="45" transform="rotate(-90)" text-anchor="middle">Average proactive intent recovery, Proc (%)</text>

    <g id="points">
      <circle class="point" cx="874.4" cy="116" r="10" fill="#2563eb"/>
      <text class="point-label" x="888" y="96">GPT-5.4</text>

      <circle class="point active" cx="972.4" cy="144" r="16" fill="#b45309"/>
      <text class="point-label active" x="990" y="125">Claude Opus 4.6</text>

      <circle class="point" cx="800.9" cy="172" r="10" fill="#c2410c"/>
      <text class="point-label" x="815" y="197">Qwen3.6 Plus</text>

      <circle class="point" cx="776.4" cy="336.5" r="10" fill="#0891b2"/>
      <text class="point-label" x="790" y="315">GLM-5.1</text>

      <circle class="point" cx="600" cy="328.8" r="10" fill="#7c3aed"/>
      <text class="point-label" x="615" y="355">MiniMax M2.7</text>

      <circle class="point" cx="600" cy="300.1" r="10" fill="#0f766e"/>
      <text class="point-label" x="615" y="306">Gemini 3.1 Pro</text>

      <circle class="point" cx="492.2" cy="371.7" r="10" fill="#be123c"/>
      <text class="point-label" x="507" y="400">DeepSeek V3.2</text>

      <circle class="point" cx="678.4" cy="562.1" r="10" fill="#475569"/>
      <text class="point-label" x="694" y="543">Kimi K2.5</text>

      <circle class="point" cx="212.9" cy="276.5" r="10" fill="#15803d"/>
      <text class="point-label" x="228" y="303">Seed2.0 Pro</text>
    </g>
  </g>

  <g id="details">
    <circle cx="1240" cy="45" r="10" fill="#b45309" stroke="#f5dbc4" stroke-width="5"/>
    <text class="card-title" x="1260" y="53">Claude Opus 4.6</text>

    <rect class="panel" x="1232" y="130" width="154" height="112" rx="7"/>
    <rect class="panel" x="1400" y="130" width="154" height="112" rx="7"/>
    <text class="card-label" x="1248" y="174">Avg Proc</text>
    <text class="card-value" x="1248" y="218">65.5</text>
    <text class="card-small" x="1330" y="218">+/- 1.4</text>
    <text class="card-label" x="1416" y="174">Avg Comp</text>
    <text class="card-value" x="1416" y="218">67.6</text>
    <text class="card-small" x="1499" y="218">+/- 1.5</text>

    <g class="domain">
      <text x="1232" y="338">Researcher</text>
      <text class="score" x="1562" y="338" text-anchor="end">Proc: 50.3</text>
      <text class="score" x="1562" y="365" text-anchor="end">Comp: 74.5</text>
      <line class="rule" x1="1232" y1="388" x2="1562" y2="388"/>

      <text x="1232" y="430">Marketer</text>
      <text class="score" x="1562" y="430" text-anchor="end">Proc: 75.0</text>
      <text class="score" x="1562" y="457" text-anchor="end">Comp: 74.6</text>
      <line class="rule" x1="1232" y1="480" x2="1562" y2="480"/>

      <text x="1232" y="522">Pharmacist</text>
      <text class="score" x="1562" y="522" text-anchor="end">Proc: 82.8</text>
      <text class="score" x="1562" y="549" text-anchor="end">Comp: 68.6</text>
      <line class="rule" x1="1232" y1="572" x2="1562" y2="572"/>

      <text x="1232" y="614">Law Trainee</text>
      <text class="score" x="1562" y="614" text-anchor="end">Proc: 45.7</text>
      <text class="score" x="1562" y="641" text-anchor="end">Comp: 57.2</text>
      <line class="rule" x1="1232" y1="664" x2="1562" y2="664"/>

      <text x="1232" y="692">Financier</text>
      <text class="score" x="1562" y="692" text-anchor="end">Proc: 73.8</text>
      <text class="score" x="1562" y="716" text-anchor="end">Comp: 63.2</text>
    </g>
  </g>
</svg>
