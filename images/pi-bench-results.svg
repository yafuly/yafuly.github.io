<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1152" role="img" aria-labelledby="title desc">
  <title id="title">π-Bench overall performance</title>
  <desc id="desc">Overall performance scatter plot comparing average task completion and proactive intent recovery, with a Claude Opus 4.6 details tooltip.</desc>
  <defs>
    <filter id="pointShadow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { fill: #171c25; font-family: Georgia, "Times New Roman", serif; font-size: 48px; font-weight: 900; }
      .panel { fill: #fbfdff; stroke: #d8e1ee; stroke-width: 1.5; }
      .plot { fill: #fcfdff; stroke: #b7c3d2; stroke-width: 1.5; }
      .grid { stroke: #dbe3ef; stroke-width: 1.1; }
      .axis { stroke: #aebccd; stroke-width: 1.9; }
      .diag { stroke: #94a3b8; stroke-width: 3.2; stroke-dasharray: 14 16; stroke-linecap: round; }
      .tick, .axis-label, .point-label, .tooltip-text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tick { fill: #516075; font-size: 24px; font-weight: 850; }
      .axis-label { fill: #151a24; font-size: 26px; font-weight: 900; }
      .point { stroke: #ffffff; stroke-width: 5; filter: url(#pointShadow); }
      .point.active { stroke: #151a24; stroke-width: 6; }
      .point-label { fill: #4e5a6d; font-size: 21px; font-weight: 900; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
      .point-label.faint { fill: #e5e7eb; stroke: #ffffff; opacity: 0.6; }
      .tooltip { fill: #ffffff; fill-opacity: 0.96; stroke: #aebccd; stroke-width: 1.5; }
      .tooltip-title { fill: #111827; font-size: 25px; font-weight: 900; }
      .tooltip-line { fill: #4e5a6d; font-size: 24px; font-weight: 750; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1152"/>
  <text class="title" x="24" y="58">Overall Performance</text>

  <rect class="panel" x="20" y="95" width="1560" height="960" rx="10"/>

  <g id="plot">
    <rect class="plot" x="150" y="150" width="1350" height="775"/>

    <g id="grid">
      <line class="grid" x1="150" y1="150" x2="150" y2="925"/>
      <line class="grid" x1="487.5" y1="150" x2="487.5" y2="925"/>
      <line class="grid" x1="825" y1="150" x2="825" y2="925"/>
      <line class="grid" x1="1162.5" y1="150" x2="1162.5" y2="925"/>
      <line class="grid" x1="1500" y1="150" x2="1500" y2="925"/>

      <line class="grid" x1="150" y1="925" x2="1500" y2="925"/>
      <line class="grid" x1="150" y1="795.8" x2="1500" y2="795.8"/>
      <line class="grid" x1="150" y1="666.7" x2="1500" y2="666.7"/>
      <line class="grid" x1="150" y1="537.5" x2="1500" y2="537.5"/>
      <line class="grid" x1="150" y1="408.3" x2="1500" y2="408.3"/>
      <line class="grid" x1="150" y1="279.2" x2="1500" y2="279.2"/>
      <line class="grid" x1="150" y1="150" x2="1500" y2="150"/>
    </g>

    <line class="axis" x1="150" y1="925" x2="1500" y2="925"/>
    <line class="axis" x1="150" y1="150" x2="150" y2="925"/>
    <line class="diag" x1="150" y1="666.7" x2="1500" y2="150"/>

    <g class="tick">
      <text x="150" y="972" text-anchor="middle">50</text>
      <text x="487.5" y="972" text-anchor="middle">55</text>
      <text x="825" y="972" text-anchor="middle">60</text>
      <text x="1162.5" y="972" text-anchor="middle">65</text>
      <text x="1500" y="972" text-anchor="middle">70</text>

      <text x="122" y="932" text-anchor="end">40</text>
      <text x="122" y="803" text-anchor="end">45</text>
      <text x="122" y="674" text-anchor="end">50</text>
      <text x="122" y="545" text-anchor="end">55</text>
      <text x="122" y="415" text-anchor="end">60</text>
      <text x="122" y="286" text-anchor="end">65</text>
      <text x="122" y="157" text-anchor="end">70</text>
    </g>

    <text class="axis-label" x="825" y="1010" text-anchor="middle">Average task completion, Comp (%)</text>
    <text class="axis-label" x="-537" y="61" transform="rotate(-90)" text-anchor="middle">Average proactive intent recovery, Proc (%)</text>

    <g id="points">
      <circle class="point" cx="1203" cy="227.5" r="12" fill="#2563eb"/>
      <text class="point-label faint" x="1223" y="214">GPT-5.4</text>

      <circle class="point active" cx="1338" cy="279.2" r="13" fill="#b45309"/>
      <text class="point-label faint" x="1360" y="246">Claude Opus 4.6</text>

      <circle class="point" cx="1089.8" cy="305" r="12" fill="#c2410c"/>
      <text class="point-label" x="1112" y="285">Qwen3.6 Plus</text>

      <circle class="point" cx="1068" cy="449.7" r="12" fill="#0891b2"/>
      <text class="point-label" x="1090" y="425">GLM-5.1</text>

      <circle class="point" cx="825" cy="522.1" r="12" fill="#7c3aed"/>
      <text class="point-label" x="844" y="520">Gemini 3.1 Pro</text>

      <circle class="point" cx="825" cy="483.3" r="12" fill="#0f766e"/>
      <text class="point-label" x="844" y="492">MiniMax M2.7</text>

      <circle class="point" cx="676.5" cy="579.6" r="12" fill="#be123c"/>
      <text class="point-label" x="696" y="616">DeepSeek V3.2</text>

      <circle class="point" cx="933" cy="844.9" r="12" fill="#475569"/>
      <text class="point-label" x="952" y="820">Kimi K2.5</text>

      <circle class="point" cx="291.8" cy="449.7" r="12" fill="#15803d"/>
      <text class="point-label" x="313" y="486">Seed2.0 Pro</text>
    </g>

    <g id="tooltip">
      <rect class="tooltip" x="1120" y="130" width="455" height="315" rx="6"/>
      <text class="tooltip-text tooltip-title" x="1142" y="171">Claude Opus 4.6</text>
      <text class="tooltip-text tooltip-line" x="1142" y="203">Overall: Proc 65.5 +/- 1.4; Comp 67.6</text>
      <text class="tooltip-text tooltip-line" x="1142" y="235">+/- 1.5</text>
      <text class="tooltip-text tooltip-line" x="1142" y="272">Researcher: Proc 50.3; Comp 74.5</text>
      <text class="tooltip-text tooltip-line" x="1142" y="308">Marketer: Proc 75.0; Comp 74.6</text>
      <text class="tooltip-text tooltip-line" x="1142" y="344">Pharmacist: Proc 82.8; Comp 68.6</text>
      <text class="tooltip-text tooltip-line" x="1142" y="380">Law Trainee: Proc 45.7; Comp 57.2</text>
      <text class="tooltip-text tooltip-line" x="1142" y="416">Financier: Proc 73.8; Comp 63.2</text>
    </g>
  </g>
</svg>
